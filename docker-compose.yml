# SQL Server para desarrollo local.
#
# Developer Edition incluye las funciones de Enterprise —particionado, compresión,
# Resource Governor—, así que lo que funciona aquí funciona en producción.

services:
  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: webhookgateway-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Local_Dev_2026!"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  sqldata:
